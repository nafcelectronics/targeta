<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital | Nelson Fuentes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card {
            background-color: #1e293b;
            border: 2px solid #0284c7;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0284c7;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
        }
        .name { font-size: 1.8rem; font-weight: bold; margin-bottom: 0.2rem; }
        .title {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }
        .qr-box {
            background-color: #fff;
            width: 190px;
            height: 190px;
            margin: 0 auto 2rem auto;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #334155;
        }
        .qr-box img { width: 100%; height: 100%; object-fit: contain; }
        .info-list { text-align: left; border-top: 1px solid #334155; padding-top: 1.5rem; }
        .info-item { font-size: 1rem; color: #94a3b8; margin-bottom: 0.8rem; }
        .info-item strong { color: #f8fafc; }
        .loc { margin-top: 1.5rem; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">NAFC ELECTRONICS</div>
        <div class="name">Nelson Fuentes</div>
        <div class="title">Gerente General</div>
        
        <!-- ESTA LÍNEA ENGANCHA TU IMAGEN CON LOGO DIRECTAMENTE -->
        <div class="qr-box">
            <img src="qr.png" alt="Código QR NAFC Electronics">
        </div>
        
        <div class="info-list">
            <div class="info-item">📞 <strong>Contacto:</strong> +507 6490-9693</div>
            <div class="info-item">📸 <strong>Instagram:</strong> @nafcelectronics</div>
            <div class="info-item">✉️ <strong>Correo:</strong> nafcelectronics@gmail.com</div>
        </div>
        
        <div class="loc">Juan Díaz, Ciudad de Panamá</div>
    </div>

</body>
</html>
